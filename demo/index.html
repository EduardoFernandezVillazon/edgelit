<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>edgelit demo</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #16171d; color: #d7d8de; font: 13px system-ui, sans-serif; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  .edgelit-label { color: #d7d8de; font-size: 12px; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .edgelit-label.root { color: #ffd166; font-weight: 600; }
  .edgelit-label.end { color: #ffd166; }
  #hud { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; line-height: 1.5; pointer-events: none; white-space: pre; }
  #controls { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  button, select { background: #2a2c36; color: inherit; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">loading…</div>
  <div id="controls">
    <select id="n"><option>500</option><option>2000</option><option selected>5000</option><option>10000</option><option>20000</option></select>
    <select id="mode"><option value="inline" selected>sim inline</option><option value="worker">sim in worker</option></select>
    <button id="fit">fit</button>
    <button id="toggle">pause</button>
  </div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
